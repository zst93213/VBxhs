name: build-and-publish

# 推送到 master / main 触发自动打包；PR 仅做编译验证不发布产物
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# PR 与 push 同时触发时取消旧 PR 构建，节省配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # WPF (.NET Framework 4.8.1) 必须在 Windows runner 上编译，Linux/macOS 无 WindowsDesktop SDK
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17'

      - name: Restore NuGet packages
        run: dotnet restore Vista.sln --verbosity minimal

      - name: Build solution (Release)
        run: dotnet build Vista.sln -c Release --no-restore --verbosity minimal

      # 仅在 push 到 master/main 时发布打包产物；PR 只跑 build 验证
      - name: Publish Vista.Presentation (framework-dependent)
        if: github.event_name == 'push'
        run: |
          dotnet publish src/Vista.Presentation/Vista.Presentation.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o publish/Vista-net481-win-x64/framework-dependent `
            --verbosity minimal

      - name: Package zip
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $zip = "publish/Vista-net481-win-x64/Vista-net481-win-x64-framework-dependent.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "publish/Vista-net481-win-x64/framework-dependent/*" -DestinationPath $zip -Force

      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: Vista-net481-win-x64
          path: publish/Vista-net481-win-x64/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/Vista-net481-win-x64/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
